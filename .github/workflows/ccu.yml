name: player counts
on:
  schedule:
    - cron: "41 */4 * * *"        # every 4 hours; the daily peak is kept
  workflow_dispatch: {}
concurrency: { group: ccu, cancel-in-progress: true }
jobs:
  ccu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: collector/requirements.txt }
      - run: pip install -r collector/requirements.txt
      - run: python -m collector.run ccu
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WATCH_LIMIT: ${{ vars.WATCH_LIMIT || '2000' }}
