name: daily snapshot
on:
  schedule:
    - cron: "17 4 * * *"          # 04:17 UTC every day
  workflow_dispatch: {}
concurrency: { group: collector, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 150          # caps a stuck run; progress is saved as it goes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: collector/requirements.txt }
      - run: pip install -r collector/requirements.txt
      - run: python -m collector.run daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WATCH_LIMIT: ${{ vars.WATCH_LIMIT || '2000' }}
