name: older games sweep
on:
  schedule:
    - cron: "23 9 * * *"          # daily: review totals + history for a seventh of the older games
    - cron: "11 2 1 * *"          # 1st of the month: re-seed the universe from SteamSpy
  workflow_dispatch:
    inputs:
      command:
        description: "sweep or seed-universe"
        default: sweep
concurrency: { group: collector, cancel-in-progress: false }
jobs:
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: collector/requirements.txt }
      - run: pip install -r collector/requirements.txt
      - name: pick command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "c=${{ inputs.command }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "11 2 1 * *" ]; then echo "c=seed-universe" >> $GITHUB_OUTPUT;
          else echo "c=sweep" >> $GITHUB_OUTPUT; fi
      - run: python -m collector.run ${{ steps.cmd.outputs.c }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SWEEP_BATCH: ${{ vars.SWEEP_BATCH || '3500' }}
